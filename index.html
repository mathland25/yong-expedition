<title>용이 탐험대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* layout: one course per screen on an iPad, big tap buttons, course rail on top, prev/next at the bottom */
:root{
  --bg:#EDF3F8; --surface:#FFFFFF; --ink:#0E2233; --ink2:#46607A; --line:#C9D8E5;
  --accent:#D9480F; --on-accent:#FFFFFF; --sel:#FFE8DB; --trail:#1C6FB8; --ok:#1B7F4B;
  --f-display:"Do Hyeon","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1622; --surface:#13222F; --ink:#E7EFF6; --ink2:#9CB3C6; --line:#25384A;
    --accent:#FF8F5A; --on-accent:#1B0B02; --sel:#3A2314; --trail:#6DB4F5; --ok:#5ED394;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1622; --surface:#13222F; --ink:#E7EFF6; --ink2:#9CB3C6; --line:#25384A;
  --accent:#FF8F5A; --on-accent:#1B0B02; --sel:#3A2314; --trail:#6DB4F5; --ok:#5ED394;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.app{max-width:880px; margin:0 auto; padding-block:20px 56px}
button{font-family:inherit; font-size:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
button:focus-visible, textarea:focus-visible{outline:3px solid var(--trail); outline-offset:2px}
h1,h2{font-family:var(--f-display); font-weight:400; margin:0; text-wrap:balance}
.eyebrow{font-size:13px; letter-spacing:.08em; color:var(--ink2); margin:0 0 4px}
h1{font-size:clamp(34px,7vw,52px); line-height:1.1}
.sub{color:var(--ink2); margin:8px 0 0; max-width:34em}
header{padding-bottom:18px}

.rail{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; margin-bottom:22px}
.stop{border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:8px 4px 9px; text-align:center; min-height:64px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:13px; line-height:1.25}
.stop .n{font-family:var(--f-display); font-size:20px; line-height:1}
.stop.done .n::after{content:" ✓"; color:var(--ok); font-size:15px}
.stop.cur{border-color:var(--accent); background:var(--sel)}

.sec{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px 18px 22px; margin-bottom:16px}
.sec h2{font-size:26px; margin-bottom:4px}
.hint{color:var(--ink2); margin:0 0 14px; font-size:15px}
.q{font-weight:700; margin:20px 0 4px}
.q:first-of-type{margin-top:6px}

.opt{min-height:56px; padding:10px 16px; border:2px solid var(--line); border-radius:12px; background:var(--surface); text-align:center; line-height:1.35}
.opt.on{border-color:var(--accent); background:var(--sel); font-weight:700}
.opt.on::before{content:"✓ "; color:var(--accent)}
.chips{display:flex; flex-wrap:wrap; gap:10px}
.chips .opt{min-width:0}

.vs{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:10px; align-items:center; margin-bottom:12px}
.vs .opt{min-height:68px; font-size:18px}
.vsmark{font-family:var(--f-display); font-size:16px; color:var(--ink2)}

.stars{display:flex; gap:8px}
.star{width:56px; height:56px; border:2px solid var(--line); border-radius:12px; background:var(--surface); font-size:26px; line-height:1; color:var(--line)}
.star.on{border-color:var(--accent); color:var(--accent); background:var(--sel)}

.jobs{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px}
.job{border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:10px; min-width:0}
.job h3{margin:0; font-size:17px}
.job p{margin:0; color:var(--ink2); font-size:15px; flex:1}
.three{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px}
.three .opt{min-height:48px; padding:6px 4px; font-size:15px}

.reveal{margin:14px 0 0; padding:12px 14px; border-radius:12px; background:var(--sel); border:1px solid var(--accent)}
.empty{color:var(--ink2); padding:12px 14px; border:2px dashed var(--line); border-radius:12px; margin:0}

.bud{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px 12px; align-items:center}
.bud .row{display:contents}
.step{display:flex; align-items:center; gap:10px}
.step button{width:52px; height:52px; border:2px solid var(--line); border-radius:12px; background:var(--surface); font-size:24px; line-height:1}
.step output{min-width:92px; text-align:center; font-weight:700; font-variant-numeric:tabular-nums}
.meter{height:14px; border-radius:7px; background:var(--line); overflow:hidden; margin:16px 0 6px}
.meter i{display:block; height:100%; background:var(--accent); width:0}
.left{font-weight:700; font-variant-numeric:tabular-nums}

.res{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px}
.card{border:1px solid var(--line); border-radius:14px; padding:14px; min-width:0}
.card b{display:block; font-size:13px; letter-spacing:.04em; color:var(--ink2); font-weight:500; margin-bottom:4px}
.card span{font-size:18px; font-weight:700; overflow-wrap:anywhere}
textarea{width:100%; border:2px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; padding:12px; line-height:1.55; resize:vertical}
.actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px}
.btn{min-height:52px; padding:10px 20px; border-radius:12px; border:2px solid var(--line); background:var(--surface); font-weight:700}
.btn.main{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.nav{display:flex; justify-content:space-between; gap:12px; margin-top:8px}
.nav .btn{flex:1; max-width:260px}
.nav .btn:last-child{margin-left:auto}
.status{min-height:24px; margin:10px 0 0; color:var(--ink2); font-size:15px}
input[type=text], input[type=date]{width:100%; max-width:440px; min-height:52px; border:2px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; padding:8px 12px}
input[type=text]:focus-visible, input[type=date]:focus-visible{outline:3px solid var(--trail); outline-offset:2px}
.cells{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px}
.cells .opt{min-height:64px}
.meter{position:relative}
.meter .mark{position:absolute; top:0; bottom:0; left:66.67%; width:3px; background:var(--ink)}
.wk{margin-top:6px; padding-top:6px}
.good{color:var(--ok); font-weight:700}
.legend{margin:0 0 10px; font-size:14px; color:var(--ink2)}
.legend b{color:var(--accent)}
.fb{border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; display:grid; gap:2px}
.fb b{font-size:13px; color:var(--ink2); font-weight:500}
.fb span{font-size:17px; overflow-wrap:anywhere}
.fb.new{border-color:var(--accent); background:var(--sel)}

@media (max-width:560px){
  .rail{grid-template-columns:repeat(4,minmax(0,1fr))}
  .vs{grid-template-columns:1fr; gap:6px}
  .vsmark{text-align:center}
  .bud{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: no-preference){
  .opt,.star,.stop{transition:background .12s, border-color .12s}
}
</style>

function stageDone(i){
  if(i===0) return Object.keys(D.bal).length>0 || D.likes.length>0;
  if(i===1) return D.read.length>0 || !!D.fav || D.star>0 || D.hard.length>0 || !!D.plan;

  if(i===5) return !!(D.mSubject||D.mChallenge||D.mReward) || missionDone()>0;
  return false;
}

function act(g, v, i){
  if(g==='go'){ D.stage = +v; ui.confirmReset = false; save(); render(); window.scrollTo(0,0); return; }
  if(g==='setcode'){ var inp = document.getElementById('codein'); var c = ((inp && inp.value) || '').trim(); if(c){ setCode(c); } return; }
  if(g==='fbseen'){ markSeen(); return; }
  if(g==='bal'){ D.bal[i] = (D.bal[i]===v ? undefined : v); if(D.bal[i]===undefined) delete D.bal[i]; }
  else if(g==='like'){ toggle(D.likes, v); }
  else if(g==='read'){
    if(v==='__none'){ D.read = has(D.read,'__none') ? [] : ['__none']; D.fav = ''; }
    else{ D.read = D.read.filter(function(x){ return x!=='__none'; }); toggle(D.read, v); if(!has(D.read, D.fav)) D.fav = ''; }
  }
  else if(g==='star'){ D.star = (D.star===+v ? 0 : +v); }
  else if(g==='hard'){ toggle(D.hard, v); }
  else if(g==='job'){ if(D.jobs[i]===v) delete D.jobs[i]; else D.jobs[i] = v;
    if(D.jobPick && D.jobs[D.jobPick]!=='love' && D.jobs[D.jobPick]!=='look'){ D.jobPick = ''; D.jobSubj = []; } }
  else if(g==='jobPick'){ var was = D.jobPick; D.jobPick = (was===v ? '' : v); if(D.jobPick!==was) D.jobSubj = []; }
  else if(g==='subj'){ toggle(D.jobSubj, v); }
  else if(g==='help'){ toggle(D.help, v); }
  else if(g==='topic'){ toggle(D.topics, v); }
  else if(g==='bud'){
    var cur = D.budget[i], nxt = cur + (+v)*BUDGET_STEP;
    if(nxt < 0) return;
    if(budgetTotal() + (+v)*BUDGET_STEP > BUDGET_MAX){ setStatus('10만원을 다 썼어. 다른 항목을 줄이면 더 쓸 수 있어.'); return; }
    D.budget[i] = nxt; setStatus('');
  }
  else if(g==='cell'){ D.mc[+v] = !D.mc[+v]; }
  else if(SINGLE[g]){ D[g] = (D[g]===v ? '' : v); }
  else if(g==='copy'){
    var ta = document.getElementById('sumtext'); ta.value = summaryText();
    var p = null;
    try{ p = navigator.clipboard.writeText(ta.value); }catch(e){ p = null; }
    if(p && p.then){ p.then(function(){ setStatus('복사했어요.'); }, function(){ ta.focus(); ta.select(); setStatus('자동 복사가 안 돼요. 선택된 글자를 직접 복사해 주세요.'); }); }
    else{ ta.focus(); ta.select(); setStatus('자동 복사가 안 돼요. 선택된 글자를 직접 복사해 주세요.'); }
    return;
  }
  else if(g==='reset'){ ui.confirmReset = true; render(); return; }
  else if(g==='resetno'){ ui.confirmReset = false; render(); return; }
  else if(g==='resetyes'){
    D = blank();
    ui.confirmReset = false; save(); render(); window.scrollTo(0,0); setStatus('처음 상태로 돌렸어요.'); return;
  }
  save();
  var main = document.getElementById('main');
  var y = window.scrollY;
  render();
  window.scrollTo(0, y);
  var sel = '[data-g="'+g+'"][data-v="'+v+'"]' + (i!==undefined ? '[data-i="'+i+'"]' : '');
  var el = document.querySelector(sel);
  if(el){ try{ el.focus({preventScroll:true}); }catch(e){} }
}

  var b = e.target.closest('[data-g]');
  if(!b) return;
  act(b.getAttribute('data-g'), b.getAttribute('data-v'), b.getAttribute('data-i') === null ? undefined : b.getAttribute('data-i'));

function makeFirebaseAdapter(cfg){
  var base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  return Promise.all([import(base+'firebase-app.js'), import(base+'firebase-firestore.js')]).then(function(m){
    var fs = m[1];
    var db = fs.getFirestore(m[0].initializeApp(cfg));
    return {
      pull: function(code){ return fs.getDoc(fs.doc(db,'students',code)).then(function(s){ return s.exists() ? s.data() : null; }); },
      push: function(code, p){ return fs.setDoc(fs.doc(db,'students',code), p); },
      watchFeedback: function(code, cb){
        return fs.onSnapshot(fs.doc(db,'feedback',code), function(s){ cb(s.exists() ? (s.data().items || []) : []); }, function(){ cb(null); });
      }
    };
  });
}
function schedulePush(){ if(!SY.connected) return; clearTimeout(SY.pushTimer); SY.pushTimer = setTimeout(pushNow, 1500); }
function pushNow(){
  if(!SY.connected) return;
  SY.msg = '저장 중…'; renderSync();
  SY.adapter.push(SY.code, {name:STUDENT_NAME, t:localT(), state:JSON.stringify(D), summary:summaryText()}).then(function(){
    SY.msg = '선생님과 연결됨 · 저장했어'; renderSync();
  }).catch(function(){
    SY.msg = '저장하지 못했어. 인터넷을 확인해 줘. 기록은 이 컴퓨터에 남아 있어.'; renderSync();
  });
}
function connect(){
  SY.msg = '연결 중…'; renderSync();
  SY.adapter.pull(SY.code).then(function(r){
    var rt = r ? (+r.t || 0) : 0;
    if(r && r.reset && rt > localT()){
      D = blank(); lsSet(KEY, JSON.stringify(D)); lsSet(KEY+'-t', String(rt)); render();
    }else if(r && r.state && rt > localT()){
      try{
        var s = JSON.parse(r.state);
        for(var k in D){ if(s[k] !== undefined) D[k] = s[k]; }
        lsSet(KEY, JSON.stringify(D)); lsSet(KEY+'-t', String(rt)); render();
      }catch(e){}
    }
    SY.connected = true; SY.msg = '선생님과 연결됨';
    if(!r || rt < localT()) pushNow(); else renderSync();
    if(SY.unwatch){ SY.unwatch(); }
    SY.unwatch = SY.adapter.watchFeedback(SY.code, function(items){ SY.fb = items; renderSync(); });
  }).catch(function(){
    SY.msg = '연결하지 못했어. 기록은 이 컴퓨터에 저장돼.'; renderSync();
  });
}
function setCode(c){ lsSet(KEY+'-code', c); SY.code = c; connect(); }
function markSeen(){
  var mx = 0; (SY.fb || []).forEach(function(f){ if(f.t > mx) mx = f.t; });
  lsSet(KEY+'-seen', String(mx)); renderSync();
}
function renderSync(){
  var el = document.getElementById('sync'); if(!el) return;
  if(!SY.adapter){ el.innerHTML = ''; return; }
  var h = '';
  if(!SY.code){
    h = '<section class="sec"><h2>접속 코드</h2><p class="hint">선생님이 알려 준 코드를 한 번만 넣어 줘.</p><div class="actions" style="margin-top:0"><input type="text" id="codein" autocomplete="off" aria-label="접속 코드"><button type="button" class="btn main" data-g="setcode">연결하기</button></div></section>';
  }else{
    h = '<p class="status" style="margin:0 0 12px">'+esc(SY.msg)+'</p>';
    var items = (SY.fb || []).slice().sort(function(a,b){ return b.t - a.t; }).slice(0,3);
    if(items.length){
      var seen = seenT();
      h += '<section class="sec"><h2>선생님 한마디</h2>'+items.map(function(f){
        var d = new Date(f.t), fresh = f.t > seen;
        return '<div class="fb'+(fresh?' new':'')+'"><b>'+esc(f.tag || '메시지')+' · '+(d.getMonth()+1)+'/'+d.getDate()+(fresh?' · 새 글':'')+'</b><span>'+esc(f.text)+'</span></div>';
      }).join('')+'<div class="actions" style="margin-top:6px"><button type="button" class="btn" data-g="fbseen">확인했어</button></div></section>';
    }
  }
  el.innerHTML = h;
}
function bootSync(){
  var p = null;
  try{ p = new URLSearchParams(location.search).get('c'); }catch(e){}
  if(p){ lsSet(KEY+'-code', p); try{ history.replaceState(null, '', location.pathname); }catch(e){} }
  var ad = window.JX_ADAPTER ? Promise.resolve(window.JX_ADAPTER)
    : (FIREBASE_CONFIG ? makeFirebaseAdapter(FIREBASE_CONFIG).catch(function(){ return null; }) : Promise.resolve(null));
  ad.then(function(a){
    if(!a) return;
    SY.adapter = a; SY.code = lsGet(KEY+'-code'); renderSync();
    if(SY.code) connect();
  });
}

load();
render();
bootSync();
</script>
